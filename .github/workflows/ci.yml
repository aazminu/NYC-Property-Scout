name: NYC-Property-Scout CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi pydantic requests python-dotenv httpx
      - name: Run pytest suite
        run: pytest -v
      - name: Run CLI verification
        run: |
          python -m utilities.cli bbl "Manhattan-835-41"
          python -m utilities.cli valuate --price 950000 --rent 5200 --common 600
          python -m utilities.cli audit
